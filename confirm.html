<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>LinguaMeet - Confirmación</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0B0F17;color:#E2E8F0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        h1{font-family:'Space Grotesk',sans-serif}
        .confirm-box{width:100%;max-width:420px;background:rgba(15,23,42,.6);border:1px solid rgba(100,116,139,.3);border-radius:12px;padding:36px;text-align:center;backdrop-filter:blur(10px)}
        .confirm-box h1{font-size:26px;background:linear-gradient(135deg,#00D4FF,#FF006E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:20px}
        .state-icon{width:84px;height:84px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
        .state-icon svg{width:64px;height:64px}
        .spin{border:5px solid rgba(0,212,255,.2);border-top-color:#00D4FF;border-radius:50%;animation:spin .9s linear infinite;width:64px;height:64px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .check{color:#22C55E;animation:pop .5s ease-out}
        @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
        .cross{color:#EF4444;animation:shake .4s ease-in-out}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        #confirmTitle{font-size:20px;font-weight:700;margin-bottom:10px}
        #confirmMsg{color:#94A3B8;font-size:14px;line-height:1.6;margin-bottom:18px}
        #countdown{color:#00D4FF;font-weight:700;font-size:14px;margin-bottom:14px;display:none}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#00D4FF,#0099CC);border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
        .btn.secondary{background:rgba(100,116,139,.3)}
    </style>
</head>
<body>
    <div class="confirm-box">
        <h1 id="brandTitle">LinguaMeet</h1>
        <div class="state-icon" id="stateIcon"><div class="spin"></div></div>
        <div id="confirmTitle">Verificando tu correo...</div>
        <div id="confirmMsg">Estamos confirmando tu cuenta. No cierres esta ventana.</div>
        <div id="countdown"></div>
        <button class="btn" id="goAppBtn" style="display:none;">Entrar a la app</button>
        <button class="btn secondary" id="goLoginBtn" style="display:none;">Volver al inicio</button>
    </div>

    <script type="module" src="js/security.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/confirm.js"></script>
</body>
</html>
