<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mymemory.translated.net; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>LinguaMeet - Inicio</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0B0F17;color:#E2E8F0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
        h1,h2,h3{font-family:'Space Grotesk',sans-serif}
        .auth-container{width:100%;max-width:420px;background:rgba(15,23,42,.6);border:1px solid rgba(100,116,139,.3);border-radius:12px;padding:32px;backdrop-filter:blur(10px)}
        .logo{text-align:center;margin-bottom:24px}
        .logo h1{font-size:32px;background:linear-gradient(135deg,#00D4FF,#FF006E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .logo p{color:#94A3B8;font-size:13px;margin-top:6px}
        .auth-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid rgba(100,116,139,.3)}
        .auth-tab{flex:1;padding:12px;background:transparent;border:none;color:#94A3B8;font-size:16px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
        .auth-tab.active{color:#00D4FF;border-bottom-color:#00D4FF}
        .auth-form{display:none}.auth-form.active{display:block}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;margin-bottom:6px;color:#CBD5E1;font-size:14px;font-weight:600}
        .form-group input,.form-group select{width:100%;padding:11px;background:rgba(30,41,59,.5);border:1px solid rgba(100,116,139,.3);border-radius:8px;color:#E2E8F0;font-size:15px}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:#00D4FF}
        .checkbox-group{display:flex;align-items:flex-start;gap:8px;margin:14px 0}
        .checkbox-group input{margin-top:4px;width:18px;height:18px}
        .checkbox-group label{font-size:13px;color:#94A3B8}
        .checkbox-group a{color:#00D4FF;text-decoration:none}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#00D4FF,#0099CC);border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
        .btn:disabled{opacity:.5}
        .alert{padding:12px;border-radius:8px;margin-bottom:14px;font-size:14px;display:none}
        .alert.error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#FCA5A5}
        .alert.success{background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.5);color:#86EFAC}
        .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .legal-links{margin-top:14px;text-align:center;font-size:13px}
        .legal-links a{color:#00D4FF;text-decoration:none;margin:0 6px}
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1 id="brandTitle">LinguaMeet</h1>
            <p>Conoce personas por videollamada y practica idiomas · Solo +18</p>
        </div>
        <div id="authAlert" class="alert"></div>
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
            <button class="auth-tab" data-tab="register">Registrarse</button>
        </div>

        <form id="loginForm" class="auth-form active">
            <div class="form-group"><label for="loginEmail">Correo Electrónico</label><input type="email" id="loginEmail" required></div>
            <div class="form-group"><label for="loginPassword">Contraseña</label><input type="password" id="loginPassword" required></div>
            <button type="submit" class="btn" id="loginBtn">Iniciar Sesión</button>
            <div class="legal-links"><a href="#" id="resendConfirmationLink">¿No confirmaste tu correo? Reenviar enlace</a></div>
        </form>

        <form id="registerForm" class="auth-form">
            <div class="form-group"><label for="registerName">Nombre Completo</label><input type="text" id="registerName" required></div>
            <div class="form-group"><label for="registerEmail">Correo Electrónico</label><input type="email" id="registerEmail" required></div>
            <div class="form-group"><label for="registerPassword">Contraseña</label><input type="password" id="registerPassword" required minlength="6"></div>
            <div class="form-group"><label for="registerBirth">Fecha de nacimiento (debes ser +18)</label><input type="date" id="registerBirth" required></div>
            <div class="form-group"><label for="registerGender">Soy</label>
                <select id="registerGender">
                    <option value="male">Hombre (quiero conocer creadoras)</option>
                    <option value="female">Mujer (quiero ser creadora)</option>
                </select>
            </div>
            <div class="checkbox-group"><input type="checkbox" id="acceptTerms" required>
                <label for="acceptTerms">Acepto los <a href="terms.html" target="_blank" rel="noopener">Términos</a> y la <a href="privacy.html" target="_blank" rel="noopener">Privacidad</a></label></div>
            <div class="checkbox-group" id="ageCheck" style="display:none;"><input type="checkbox" id="isAdult">
                <label for="isAdult">Confirmo que soy +18 y acepto la verificación de creadora</label></div>
            <button type="submit" class="btn" id="registerBtn">Crear Cuenta</button>
        </form>

        <div class="legal-links">
            <a href="terms.html" target="_blank" rel="noopener">Términos</a>·<a href="privacy.html" target="_blank" rel="noopener">Privacidad</a>·<a href="mailto:soporte@condonis.com">Soporte</a>
        </div>
    </div>

    <!-- Scripts: security.js primero (endurecedor), luego config, i18n y auth -->
    <script type="module" src="js/security.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
