<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDONIS</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos globales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0B0F17;
            color: #E2E8F0;
            min-height: 100vh;
            padding-bottom: 80px; /* Espacio para bottom-nav */
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Header */
        .app-header {
            position: sticky;
            top: 0;
            background: rgba(11, 15, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 116, 139, 0.3);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #00D4FF 0%, #FF006E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00D4FF 0%, #FF006E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .user-balance {
            font-size: 14px;
            color: #00D4FF;
            font-weight: 600;
        }

        /* Contenido principal */
        .app-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Secciones (cada una es una "página" de la SPA) */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(100, 116, 139, 0.3);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 8px 16px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #00D4FF;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 600;
        }

        /* Cards genéricas */
        .card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #E2E8F0;
        }

        /* Grid de modelos */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .model-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-card:hover {
            transform: translateY(-4px);
            border-color: #00D4FF;
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.2);
        }

        .model-avatar {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
        }

        .model-info {
            padding: 16px;
        }

        .model-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .model-rate {
            font-size: 14px;
            color: #00D4FF;
            font-weight: 600;
        }

        .model-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.2);
            color: #86EFAC;
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
        }

        /* Botones */
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00D4FF 0%, #0099CC 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }

        /* Toasts */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            padding: 16px 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease-out;
        }

        .toast.success {
            border-left: 4px solid #22C55E;
        }

        .toast.error {
            border-left: 4px solid #EF4444;
        }

        .toast.info {
            border-left: 4px solid #00D4FF;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Spinner de carga */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .models-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <h1>CONDONIS</h1>
        <div class="user-info">
            <div class="user-balance" id="userBalance">0 tokens</div>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="app-content">
        <!-- Sección: Home (Modelos en línea) -->
        <section id="sectionHome" class="section active">
            <h2>Modelos en Línea</h2>
            <p style="color: #94A3B8; margin-top: 8px;">Conecta con modelos disponibles ahora</p>
            <div id="modelsContainer" class="models-grid"></div>
        </section>

        <!-- Sección: Mi Perfil -->
        <section id="sectionProfile" class="section">
            <h2>Mi Perfil</h2>
            <div class="card" style="margin-top: 20px;">
                <div class="card-header">
                    <span class="card-title">Información Personal</span>
                </div>
                <div id="profileContent"></div>
                <button class="btn btn-danger" onclick="logout()" style="margin-top: 16px;">Cerrar Sesión</button>
            </div>
        </section>

        <!-- Sección: Historial -->
        <section id="sectionHistory" class="section">
            <h2>Historial</h2>
            <div id="historyContent" style="margin-top: 20px;">
                <p style="color: #94A3B8;">Cargando historial...</p>
            </div>
        </section>

        <!-- Sección: Admin (solo visible para admins) -->
        <section id="sectionAdmin" class="section">
            <h2>Panel de Administración</h2>
            <div id="adminContent" style="margin-top: 20px;">
                <p style="color: #94A3B8;">Cargando panel de administración...</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-section="sectionHome">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="nav-label">Inicio</span>
        </button>
        <button class="nav-item" data-section="sectionHistory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="nav-label">Historial</span>
        </button>
        <button class="nav-item" data-section="sectionProfile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="nav-label">Perfil</span>
        </button>
    </nav>

    <!-- Contenedor de Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts (cargar en orden específico) -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/core.js"></script>
    <script type="module" src="js/models.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
